apiVersion: apps/v1
kind: Deployment
metadata:
  name: thread-app-deployment
  labels:
    app: thread-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thread-app
  template:
    metadata:
      labels:
        app: thread-app
    spec:
      containers:
      - name: thread-app
        image: PLACEHOLDER_IMAGE #372641111498.dkr.ecr.ap-south-1.amazonaws.com/thread-app:thread-app-7
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: thread-app-secrets
              key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        - name: CLERK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: thread-app-secrets
              key: CLERK_SECRET_KEY
        - name: NEXT_CLERK_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: thread-app-secrets
              key: NEXT_CLERK_WEBHOOK_SECRET
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: thread-app-secrets
              key: MONGODB_URL