---
- name: Install docker, docker compose
  hosts: jenkins_server
  become: true
  tasks:
    - name: Install docker and docker compose
      ansible.builtin.yum:
        name: docker
        update_cache: true
        state: present

    - name: Install docker compose plugin
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        mode: "+x"

    - name: Start docker 
      ansible.builtin.systemd:
        name: docker 
        state: started
        enabled: true

- name: Add ec2-user to docker group
  hosts: jenkins_server
  become: true
  tasks:  
    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: true
    # reconnect machine, so user and their groups reflect
    - name: Reconnect to server session
      meta: reset_connection

- name: Copy docker-compose file on ec2 machine
  hosts: jenkins_server
  tasks:
    - name: Copy docker-compose file on ec2 machine
      ansible.builtin.copy:
        src: docker-compose.yaml
        dest: /home/ec2-user/docker-compose.yaml
        owner: ec2-user
        group: ec2-user

- name: Start Jenkins container
  hosts: jenkins_server
  tasks:
    - name: Start Jenkins container
      ansible.builtin.command:
        cmd: docker compose -f /home/ec2-user/docker-compose.yaml up -d
        chdir: /home/ec2-user

- name: Install docker CLI inside jenkins container
  hosts: jenkins_server
  tasks:
    - name: Install docker CLI inside jenkins container
      ansible.builtin.command:
        cmd: docker exec jenkins bash -c "apt-get update && apt-get install -y docker.io"